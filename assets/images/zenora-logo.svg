<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C287" />
      <stop offset="50%" stop-color="#C5A880" />
      <stop offset="100%" stop-color="#9E7A52" />
    </linearGradient>
  </defs>
  
  <!-- Architectural Monogram -->
  <g transform="translate(30, 20)">
    <!-- Stylized Chevron / Peak -->
    <path d="M 10 65 L 35 25 L 60 65" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 18 65 L 35 37 L 52 65" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
    <!-- Central Spire & Dot -->
    <line x1="35" y1="25" x2="35" y2="8" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="35" cy="5" r="2.5" fill="url(#goldGrad)"/>
    <!-- Ground Accent Line -->
    <line x1="6" y1="72" x2="64" y2="72" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Typography -->
  <!-- Brand Name -->
  <text x="120" y="52" font-family="'Cinzel', 'Cormorant Garamond', Georgia, serif" font-size="28" font-weight="600" letter-spacing="6" fill="#F5EFEB">
    ZENORA
  </text>
  <text x="290" y="52" font-family="'Cinzel', 'Cormorant Garamond', Georgia, serif" font-size="24" font-weight="300" letter-spacing="4" fill="#C5A880">
    DESIGNS
  </text>
  
  <!-- Divider Line -->
  <line x1="120" y1="64" x2="380" y2="64" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.4"/>
  
  <!-- Tagline -->
  <text x="122" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="500" letter-spacing="5" fill="#B8B0A8" opacity="0.9">
    RARE. REFINED. DIVINE.
  </text>
</svg>
